name: LINE Notify

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1" # 每週一 08:00 台灣時間（UTC+8 → UTC 00:00）

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Send LINE message
        env:
          LINE_TOKEN: ${{ secrets.LINE_MSG_TOKEN }}
          LINE_TARGET_ID: ${{ secrets.LINE_TARGET_ID }}
        run: |
          DATA_DIR=src/main/resources/static/opendata/holiday
          TODAY=$(TZ=Asia/Taipei date +%Y%m%d)
          YEAR=${TODAY:0:4}

          FILES=()
          for y in $((YEAR - 1)) "$YEAR" $((YEAR + 1)); do
            [ -f "$DATA_DIR/$y.json" ] && FILES+=("$DATA_DIR/$y.json")
          done

          fmt() { echo "${1:0:4}/${1:4:2}/${1:6:2}"; }

          # 連假：連續 3 天以上放假（含週末與補假，純週末 2 天不算），且連假開始日落在今天起 7 天內
          RESULT=$(jq -s -c --arg today "$TODAY" '
            def prev: strptime("%Y%m%d") | mktime | . - 86400 | strftime("%Y%m%d");
            def next: strptime("%Y%m%d") | mktime | . + 86400 | strftime("%Y%m%d");
            def plus($n): strptime("%Y%m%d") | mktime | . + 86400 * $n | strftime("%Y%m%d");
            def days: strptime("%Y%m%d") | mktime / 86400 | floor;
            add as $all
            | ($all | map(select(.holiday == true) | {(.date): true}) | add) as $H
            | ($all | map(select(.holiday == true) | .date) | unique) as $dates
            | [ $dates[] as $s
                | select(($H[($s | prev)] | not) and $s >= $today and $s <= ($today | plus(6)))
                | ($s | until(($H[(next)]) | not; next)) as $e
                | select((($e | days) - ($s | days)) + 1 >= 3)
                | ($all | map(select(.holiday == true and .date >= $s and .date <= $e and (.name // "") != "")) | first) as $n
                | {start: $s, end: $e, date: ($n.date // $s), name: ($n.name // "放假")}
              ]
            | first // empty
          ' "${FILES[@]}")

          if [ -z "$RESULT" ]; then
            echo "今天起 7 天內無連假，略過發送"
            exit 0
          fi

          START=$(echo "$RESULT" | jq -r '.start')
          END=$(echo "$RESULT" | jq -r '.end')
          DATE=$(echo "$RESULT" | jq -r '.date')
          NAME=$(echo "$RESULT" | jq -r '.name')
          DAYS=$(( ( $(date -u -d "${DATE:0:4}-${DATE:4:2}-${DATE:6:2}" +%s) - $(date -u -d "${TODAY:0:4}-${TODAY:4:2}-${TODAY:6:2}" +%s) ) / 86400 ))

          TEXT="【重要】距離放假 $(fmt "$START")~$(fmt "$END") (${NAME}) 還有 ${DAYS} 天，還不快規劃怎麼喝！"
          echo "發送內容：$TEXT"

          BODY=$(jq -n \
            --arg to "$LINE_TARGET_ID" \
            --arg text "$TEXT" \
            '{to: $to, messages: [{type: "text", text: $text}]}')

          curl -sS --fail-with-body -X POST https://api.line.me/v2/bot/message/push \
            -H "Authorization: Bearer $LINE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY"
