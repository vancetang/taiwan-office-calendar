name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # schedule:
  #   - cron: "0 2 * * 0"

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-26.04
    name: Secrets Detection

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch full history for secret scanning

      - name: Run TruffleHog OSS (PR diff scan)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@v3.99.2
        with:
          path: ./
          base: ${{ github.base_ref }}
          head: ${{ github.head_ref }}
          extra_args: --debug --only-verified --fail

      - name: Run TruffleHog OSS (full history scan)
        # On push/schedule events base == HEAD would make the diff scan a no-op
        # error, so scan the full repository history instead.
        if: github.event_name != 'pull_request'
        uses: trufflesecurity/trufflehog@v3.99.2
        with:
          path: ./
          extra_args: --debug --only-verified --fail
